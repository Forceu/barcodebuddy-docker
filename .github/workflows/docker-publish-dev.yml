name: Docker Publish Multiarch Dev

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number of new release'     
        required: true
      ref:
        description: 'Tag, branch or commit hash of Forceu/barcodebuddy to build (HEAD = latest commit of default branch)'
        required: false
        default: 'HEAD'


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: install buildx
        id: buildx
        uses: crazy-max/ghaction-docker-buildx@v1

      - name: Log into registry
        run: echo "${{ secrets.DOCKER_PW }}" | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build and push image
        run: docker buildx build --push --build-arg BUILD_DATE=`date -u +"%Y-%m-%dT%H:%M:%SZ"` --build-arg VERSION="${{ github.event.inputs.version }}" --build-arg BBUDDY_REF="${{ github.event.inputs.ref || 'HEAD' }}" -f Dockerfile -t f0rc3/barcodebuddy:latest-dev --platform linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64  .
